name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Verify tag matches package version
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(
            cargo metadata --no-deps --format-version=1 |
              python3 -c 'import json, sys; print(json.load(sys.stdin)["packages"][0]["version"])'
          )"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$package_version" != "$tag_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $package_version"
            exit 1
          fi

  release:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-apple-darwin
          - aarch64-apple-darwin
          - x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - run: cargo build --release --target ${{ matrix.target }}

      - uses: softprops/action-gh-release@v2
        with:
          files: target/${{ matrix.target }}/release/c2ap*

  publish:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Publish crate when version is new
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(
            cargo metadata --no-deps --format-version=1 |
              python3 -c 'import json, sys; print(json.load(sys.stdin)["packages"][0]["version"])'
          )"
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          status="$(
            curl --silent --show-error --location \
              --output "$response_file" --write-out "%{http_code}" \
              "https://crates.io/api/v1/crates/c2ap/$package_version"
          )"
          case "$status" in
            200)
              repository="$(
                python3 - "$response_file" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as response:
              print(json.load(response)["crate"].get("repository", ""))
          PY
              )"
              if [[ "$repository" != "https://github.com/drmaas/claude2agentplugins" ]]; then
                echo "c2ap $package_version exists on crates.io but belongs to $repository"
                exit 1
              fi
              echo "c2ap $package_version is already published; skipping."
              ;;
            404)
              cargo publish --locked
              ;;
            *)
              echo "Unable to check crates.io for c2ap $package_version (HTTP $status)"
              exit 1
              ;;
          esac
