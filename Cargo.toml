[package]
name = "c2ap"
version = "0.1.0"
edition = "2024"
description = "Convert Claude Code plugins to Agent Plugins v1.0.0 and OpenCode v2 plugins"
license = "MIT"
repository = "https://github.com/drmaas/claude2agentplugins"
readme = "README.md"
keywords = ["claude", "plugins", "agent", "opencode", "converter"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "c2ap"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
anyhow = "1"
thiserror = "2"
tempfile = "3"
walkdir = "2"
regex = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
git2 = "0.19"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
pretty_assertions = "1"
